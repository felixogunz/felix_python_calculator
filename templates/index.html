<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FelProCalc | Felix Professional Calculator</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css')}}">
</head>

<body>
    <div class="app">

        <header class="top-bar">
            <div>
                <h1>FelProCalc</h1>
                <p>Felix Professional Calculator</p>
            </div>

            <button id="themeToggle" class="icon-button" title="Toggle theme">
                ☾
            </button>
        </header>

        <main class="calculator-layout">

            <section class="calculator">

                <div class="display-container">
                    <div id="expression" class="expression"></div>
                    <div id="display" class="display">
                        0
                    </div>
                </div>

                <div class="calculator-controls">

                    <button class="function-button" data-action="clear">
                        AC
                    </button>

                    <button class="function-button" data-action="delete">
                        DEL
                    </button>

                    <button class="function-button" data-value="%">
                        %
                    </button>

                    <button class="function-button" data-value="/">
                        /
                    </button>

                    <button data-value="7">
                        7
                    </button>

                    <button data-value="8">
                        8
                    </button>

                    <button data-value="9">
                        9
                    </button>

                    <button data-value="*" class="operator-button">
                        *
                    </button>

                    <button data-value="4">
                        4
                    </button>

                    <button data-value="5">
                        5
                    </button>

                    <button data-value="6">
                        6
                    </button>

                    <button data-value="-" class="operator-button">
                        -
                    </button>

                    <button data-value="1">
                        1
                    </button>

                    <button data-value="2">
                        2
                    </button>

                    <button data-value="3">
                        3
                    </button>

                    <button data-value="+" class="operator-button">
                        +
                    </button>

                     <button data-action="toggle-sign">
                        ±
                    </button>

                    <button data-value="0">
                        0
                    </button>

                    <button data-value=".">
                        .
                    </button>

                    <button class="equals-button" data-action="calculate">
                        =
                    </button>

                </div>

                <div class="extra-functions">

                    <button data-value="(">
                        (
                    </button>

                    <button data-value=")">
                        )
                    </button>

                    <button data-action="square">
                        x²
                    </button>

                    <button data-action="sqrt">
                        √x
                    </button>

                    <button data-action="reciprocal">
                        1/x
                    </button>
                </div>

                <div class="scientific-functions">
                    <button data-action="sin">
                        sin
                    </button>

                    <button data-action="cos">
                        cos
                    </button>

                    <button data-action="tan">
                        tan
                    </button>

                    <button data-action="log">
                        log
                    </button>

                    <button data-action="ln">
                        ln
                    </button>

                    <button data-action="power">
                        xʸ
                    </button>

                </div>
            </section>

            <aside class="history-panel">

                <div class="history-header">
                    <div>
                        <h2>History</h2>
                        <p>Your recent calculations</p>
                    </div>

                    <button id="clearHistory" class="clear-history">
                        Clear
                    </button>
                </div>

                <div id="history" class="history-list">
                    <p class="empty-history">
                        No calculations yet
                    </p>
                </div>
            </aside>
        </main>

        <footer>
            <p>FelixProCalc . Built with HTML, CSS, Javascript and Flask</p>
        </footer>

    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
    
</body>
</html>
